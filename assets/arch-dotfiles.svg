<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Arch Linux + Hyprland dotfiles</title>
  <desc id="desc">Project cover with a stylized monochrome desktop, terminal, workspace bar and configuration menu.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111719"/>
      <stop offset="1" stop-color="#080b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="10%" r="75%">
      <stop stop-color="#78d5df" stop-opacity=".12"/>
      <stop offset="1" stop-color="#78d5df" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#78d5df" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="desktop" x2="0" y2="1">
      <stop stop-color="#23272a"/>
      <stop offset="1" stop-color="#141719"/>
    </linearGradient>
    <clipPath id="round"><rect width="960" height="540" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, "Liberation Mono", Menlo, monospace; }
  </style>
  <g clip-path="url(#round)">
    <rect width="960" height="540" fill="url(#background)"/>
    <rect width="960" height="540" fill="url(#grid)"/>
    <rect width="960" height="540" fill="url(#glow)"/>
    <text x="48" y="54" fill="#78d5df" font-size="14" font-weight="600" letter-spacing="3">332MINDSET / DOTFILES</text>
    <text x="48" y="120" fill="#f1f4f4" font-size="50" font-weight="750" letter-spacing="-2">Arch Linux + Hyprland</text>
    <text x="50" y="159" fill="#a5b0b2" font-size="20">Monochrome. Smooth motion. Custom tools.</text>
    <rect x="49" y="184" width="67" height="26" rx="13" fill="#78d5df" fill-opacity=".10" stroke="#78d5df" stroke-opacity=".22"/>
    <text x="82.5" y="201" fill="#b9e5e9" font-size="12" text-anchor="middle">LUA</text>
    <rect x="126" y="184" width="85" height="26" rx="13" fill="#78d5df" fill-opacity=".10" stroke="#78d5df" stroke-opacity=".22"/>
    <text x="168.5" y="201" fill="#b9e5e9" font-size="12" text-anchor="middle">PYTHON</text>
    <rect x="221" y="184" width="79" height="26" rx="13" fill="#78d5df" fill-opacity=".10" stroke="#78d5df" stroke-opacity=".22"/>
    <text x="260.5" y="201" fill="#b9e5e9" font-size="12" text-anchor="middle">SHELL</text>

    <!-- Abstract desktop illustration; this is a project cover, not a screenshot. -->
    <rect x="48" y="240" width="864" height="253" rx="16" fill="#000" fill-opacity=".28"/>
    <rect x="48" y="234" width="864" height="253" rx="16" fill="url(#desktop)" stroke="#3c474a"/>
    <path d="M526 487 675 298l137 189" fill="#fff" fill-opacity=".025"/>
    <path d="m604 487 87-114 95 114" fill="#fff" fill-opacity=".025"/>

    <rect x="64" y="249" width="832" height="30" rx="8" fill="#111416" stroke="#42474a" stroke-opacity=".65"/>
    <text class="mono" x="80" y="269" fill="#c4ccce" font-size="12">~ terminal</text>
    <rect x="411" y="255" width="23" height="18" rx="5" fill="#d6dcdd"/>
    <text class="mono" x="422.5" y="268" fill="#191d1f" font-size="11" text-anchor="middle">A</text>
    <text class="mono" x="450" y="268" fill="#8a9599" font-size="11">B</text>
    <text class="mono" x="478" y="268" fill="#8a9599" font-size="11">C</text>
    <text class="mono" x="506" y="268" fill="#8a9599" font-size="11">D</text>
    <g fill="#a8b0b2">
      <rect x="742" y="264" width="3" height="7" rx="1"/>
      <rect x="748" y="258" width="3" height="13" rx="1"/>
      <rect x="754" y="261" width="3" height="10" rx="1"/>
      <rect x="760" y="255" width="3" height="16" rx="1"/>
      <rect x="766" y="261" width="3" height="10" rx="1"/>
      <rect x="772" y="265" width="3" height="6" rx="1"/>
    </g>
    <text class="mono" x="824" y="269" fill="#c4ccce" font-size="12">19:32</text>
    <circle cx="879" cy="264" r="4" fill="none" stroke="#a8b0b2"/>

    <rect x="80" y="302" width="462" height="162" rx="12" fill="#121517" stroke="#687174"/>
    <path d="M81 331h460" stroke="#343b3e"/>
    <circle cx="97" cy="317" r="3" fill="#667074"/>
    <circle cx="108" cy="317" r="3" fill="#8c979b"/>
    <circle cx="119" cy="317" r="3" fill="#bac3c6"/>
    <text class="mono" x="511" y="320" fill="#889498" font-size="11" text-anchor="end">foot</text>
    <path d="m130 351-31 65 21-8 10-17 10 17 21 8-31-65Z" fill="#c9d0d2"/>
    <text class="mono" x="183" y="359" fill="#e0e6e7" font-size="13">hanagumori</text>
    <text class="mono" x="183" y="381" fill="#7d898e" font-size="12">os      <tspan fill="#c7d0d3">Arch Linux</tspan></text>
    <text class="mono" x="183" y="403" fill="#7d898e" font-size="12">desktop <tspan fill="#c7d0d3">Hyprland</tspan></text>
    <text class="mono" x="101" y="443" fill="#a4c5ca" font-size="12">~ <tspan fill="#d5dcde">$ cava</tspan></text>
    <rect x="163" y="432" width="7" height="13" rx="1" fill="#7e8a8e"/>

    <rect x="570" y="312" width="306" height="141" rx="12" fill="#1b2022" stroke="#50595d"/>
    <rect x="582" y="324" width="86" height="117" rx="7" fill="#292f32"/>
    <rect x="589" y="335" width="72" height="26" rx="5" fill="#d1d8da"/>
    <text x="625" y="352" fill="#202629" font-size="11" text-anchor="middle">Apps</text>
    <text x="625" y="386" fill="#a7b1b5" font-size="11" text-anchor="middle">Configs</text>
    <text x="625" y="420" fill="#a7b1b5" font-size="11" text-anchor="middle">Files</text>
    <text x="683" y="352" fill="#c4cdd0" font-size="12">Terminal</text>
    <text x="683" y="386" fill="#89969b" font-size="12">File manager</text>
    <text x="683" y="420" fill="#89969b" font-size="12">Wallpapers</text>
    <path d="m849 343 4 4-4 4" stroke="#879398" stroke-width="1.5" fill="none"/>
  </g>
  <rect x=".5" y=".5" width="959" height="539" rx="19.5" fill="none" stroke="#78d5df" stroke-opacity=".20"/>
</svg>
